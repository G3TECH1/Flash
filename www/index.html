<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
</head>

<body>
    <main class="container">
        <h1>Flash File Transfer</h1>

        <section>
            <h2>This PC can receive files</h2>
            <p>Your pairing code: <strong id="myCode">Loading...</strong></p>
        </section>

        <section>
            <h2>Send files to another PC</h2>

            <label for="devices">Nearby Flash PCs</label>
            <select id="devices">
                <option value="">Searching...</option>
            </select>

            <label for="pairingCode">Their pairing code</label>
            <input id="pairingCode" inputmode="numeric" maxlength="6" placeholder="6-digit code">

            <button id="pair">Pair</button>

            <input id="filePicker" type="file" multiple>
            <button id="send" disabled>Send files</button>

            <p id="result" role="status"></p>
        </section>
    </main>

    <script src="js/sender.js"></script>
    <script src="js/pairing.js"></script>
    <script>
        const localApi = "http://127.0.0.1:45678";
        const deviceSelect = document.getElementById("devices");
        const codeInput = document.getElementById("pairingCode");
        const filePicker = document.getElementById("filePicker");
        const pairButton = document.getElementById("pair");
        const sendButton = document.getElementById("send");
        const result = document.getElementById("result");

        let pairedDevice = null;
        let pairedToken = null;

        async function loadMyCode() {
           const code = await window.FlashPairing.getPairingCode(localApi)
            document.getElementById("myCode").textContent = code;
        }

        async function loadDevices() {
            const response = await fetch(`${localApi}/devices`);
            const devices = await response.json();

            deviceSelect.replaceChildren(new Option("Choose a nearby PC", ""));

            for (const device of devices) {
                deviceSelect.add(new Option(device.name, device.url));
            }
        }

        deviceSelect.addEventListener("change", () => {
            pairedDevice = null;
            pairedToken = null;
            sendButton.disabled = true;
            result.textContent = "";
        });

        pairButton.addEventListener("click", async () => {
            const targetUrl = deviceSelect.value;
            const code = codeInput.value.trim();

            if (!targetUrl) {
                result.textContent = "Choose a nearby PC first.";
                return;
            }

            if (!/^\d{6}$/.test(code)) {
                result.textContent = "Enter the six-digit code shown on that PC.";
                return;
            }

            try {
                result.textContent = "Pairing...";
                const data = await window.FlashPairing.pairWithDevice(targetUrl, code);

                pairedDevice = targetUrl;
                pairedToken = data.token;
                sendButton.disabled = false;
                result.textContent = "Paired. Choose files to send.";
            } catch (error) {
                result.textContent = `Pairing failed: ${error.message}`;
            }
        });

        sendButton.addEventListener("click", async () => {
            try {
                sendButton.disabled = true;
                result.textContent = "Sending files...";

                const receipt = await window.FlashSender.sendFiles(
                    pairedDevice,
                    filePicker.files,
                    pairedToken
                );

                result.textContent =
                    `Success: ${receipt.count} file(s) received by the other PC.`;
                filePicker.value = "";
            } catch (error) {
                result.textContent = `Send failed: ${error.message}`;
            } finally {
                sendButton.disabled = !pairedToken;
            }
        });

        loadMyCode().catch((error) => {
            document.getElementById("myCode").textContent = "Unavailable";
            result.textContent = `Could not load local pairing code: ${error.message}`;
        });

        loadDevices().catch((error) => {
            deviceSelect.replaceChildren(new Option("Device search unavailable", ""));
            result.textContent = `Could not find nearby PCs: ${error.message}`;
        });

        setInterval(() => {
            loadDevices().catch(() => { });
        }, 5000);
    </script>
</body>

</html>
